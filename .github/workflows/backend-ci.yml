name: Backend CI

on:
  push:
    branches: [backend-deploy]
  pull_request:
    branches: [main, railway-api]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run checks and API tests
        run: npm run test:all
      - name: Run database-backed API integration tests
        run: npm run test:api-integration
      - name: Build deployment image
        run: docker build -t streamvoice-api:test .
