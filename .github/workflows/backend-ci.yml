name: Backend CI

on:
  push:
    branches: [backend-deploy]
  pull_request:
    branches: [main, railway-api]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run checks and API tests
        run: npm run test:all
      - name: Run database-backed API integration tests
        shell: bash
        run: |
          npm run dev:db > /tmp/streamvoice-pglite.log 2>&1 &
          DB_PID=$!
          trap 'kill "$DB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/55432) >/dev/null 2>&1; then break; fi
            sleep 1
          done
          export DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55432/postgres
          npm run migrate
          npm run test:api-integration
      - name: Build deployment image
        run: docker build -t streamvoice-api:test .
